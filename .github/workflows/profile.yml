name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour to avoid the scheduler rush
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    name: Render stat cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROFILE_PAT }} # pushes made with a PAT count as activity, so the schedule never auto-disables
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate SVGs from live GitHub data
        run: python scripts/generate_profile.py assets
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }} # owner token, so private contribution counts are included
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "chore: refresh profile cards" && git push; }
