[project]
name = "corfucinas-profile"
version = "1.0.0"
description = "Animated GitHub profile cards rendered daily from live stats"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [] # the generator is stdlib-only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
